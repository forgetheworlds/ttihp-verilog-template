<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="646" viewBox="0 0 1000 646" role="img" aria-labelledby="t d">
<title id="t">Pacer timing at a fractional period</title>
<desc id="d">Measured PACE completion instants for a 100.5-cycle period, the fractional carry sequence, and the drift a naive integer divider accumulates.</desc>
<style>
  :root { --fg:#1f2328; --muted:#57606a; --border:#c9d1d9;
           --surface:#f6f8fa; --accent:#0969da; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e6edf3; --muted:#8b949e; --border:#30363d;
             --surface:#161b22; --accent:#58a6ff; }
  }
  text { font-family:ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; fill:var(--fg,#1f2328); }
  .m { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .dim { fill:var(--muted,#57606a); }
  .acc { fill:var(--accent,#0969da); }
  .box { fill:none; stroke:var(--border,#c9d1d9); stroke-width:1.2; }
  .hi  { fill:none; stroke:var(--accent,#0969da); stroke-width:1.4; }
  .w   { stroke:var(--fg,#1f2328); stroke-width:1.6; fill:none; }
  .tick{ stroke:var(--accent,#0969da); stroke-width:1; stroke-dasharray:3 3; fill:none; }
  .grid{ stroke:var(--border,#c9d1d9); stroke-width:1; fill:none; }
  .arrow { stroke:var(--fg,#1f2328); stroke-width:1.2; fill:none; }
  .naive { stroke:var(--fg,#1f2328); stroke-width:1.3; fill:none; stroke-dasharray:6 3; }
</style>
<text x="24" y="26" font-size="17" text-anchor="start" class="" font-weight="600">Deadline pacing: 100.5 cycles per PACE, no drift</text>
<text x="24" y="44" font-size="11.5" text-anchor="start" class="dim">Measured on tools/model.py with period 0x6480 (24.8 fixed point) — a fractional period no integer divider can express.</text>
<rect x="24" y="64" width="470" height="86" rx="4" class="box" />
<text x="38" y="86" font-size="10.5" text-anchor="start" class="m">period = 0x6480 = 25728 / 256 = 100.5 cycles</text>
<text x="38" y="106" font-size="10.5" text-anchor="start" class="m dim">PACERST latches next_int = cycle, next_frac = 0</text>
<text x="38" y="124" font-size="10.5" text-anchor="start" class="m dim">completion instant = floor(c0 + k · period / 256)</text>
<text x="38" y="142" font-size="10.5" text-anchor="start" class="m dim">average exact, jitter ≤ 1 cycle, 2^32-cycle horizon</text>
<rect x="506" y="64" width="470" height="86" rx="4" class="box" />
<text x="520" y="86" font-size="10.5" text-anchor="start" class="" font-weight="600">on each completion:</text>
<text x="520" y="106" font-size="10.5" text-anchor="start" class="m">{carry, next_frac} = next_frac + period[7:0]</text>
<text x="520" y="124" font-size="10.5" text-anchor="start" class="m">next_int = next_int + period[31:8] + carry</text>
<text x="520" y="144" font-size="9.5" text-anchor="start" class="m dim">frac 0x80 → next_frac 128, 0, 128, 0 … carry every other PACE</text>
<text x="24" y="186" font-size="11" text-anchor="start" class="" font-weight="600">A  measured completion instants, cycles 0..1100</text>
