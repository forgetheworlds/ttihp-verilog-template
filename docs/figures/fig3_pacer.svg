<text x="101.56363636363636" y="290" font-size="9.5" text-anchor="start" class="m dim">PACERST at cycle 2; the PACE issued at cycle 3 completes at once (a one-cycle stub), so the</text>
<text x="101.56363636363636" y="304" font-size="9.5" text-anchor="start" class="m dim">grid anchor stays at 2 and the first real completion is floor(2 + 100.5) = 102.</text>
<text x="24" y="322" font-size="9.5" text-anchor="start" class="m dim">intervals: 99 (stub), then 101, 100, 101, 100 …  the ±1 alternation is the carried fraction, not jitter.</text>
