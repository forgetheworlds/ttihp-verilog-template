<text x="178" y="470" font-size="9.5" text-anchor="start" class="m dim">naive ÷100 divider (dashed): −19 cycles by PACE #40; the measured pacer sits on 0</text>
<text x="24" y="502" font-size="9.5" text-anchor="start" class="m dim">0.5 cycle per period is exactly the quantity a divider must discard; the pacer keeps it in next_frac instead, so the error never accumulates.</text>
