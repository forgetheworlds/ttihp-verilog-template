<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="532" viewBox="0 0 1000 532" role="img" aria-labelledby="t d">
<title id="t">UART 8N1 frame from the model</title>
<desc id="d">Measured UIO[0] waveform for byte 0xA5 from firmware/uart_tx.asm, with pacer tick instants, ten 434-cycle bit slots, sample points and a zoom on the two-cycle tick-to-edge latency.</desc>
<style>
  :root { --fg:#1f2328; --muted:#57606a; --border:#c9d1d9;
           --surface:#f6f8fa; --accent:#0969da; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e6edf3; --muted:#8b949e; --border:#30363d;
             --surface:#161b22; --accent:#58a6ff; }
  }
  text { font-family:ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; fill:var(--fg,#1f2328); }
  .m { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .dim { fill:var(--muted,#57606a); }
  .acc { fill:var(--accent,#0969da); }
  .box { fill:none; stroke:var(--border,#c9d1d9); stroke-width:1.2; }
  .hi  { fill:none; stroke:var(--accent,#0969da); stroke-width:1.4; }
  .w   { stroke:var(--fg,#1f2328); stroke-width:1.6; fill:none; }
  .tick{ stroke:var(--accent,#0969da); stroke-width:1; stroke-dasharray:3 3; fill:none; }
  .grid{ stroke:var(--border,#c9d1d9); stroke-width:1; fill:none; }
  .arrow { stroke:var(--fg,#1f2328); stroke-width:1.2; fill:none; }
  .naive { stroke:var(--muted,#57606a); stroke-width:1.4; fill:none; }
</style>
<text x="24" y="26" font-size="17" text-anchor="start" class="" font-weight="600">A real UART frame: 8N1, byte 0xA5, straight out of the model</text>
<text x="24" y="44" font-size="11.5" text-anchor="start" class="dim">firmware/uart_tx.asm (18 words) on engine 0; the pad is sampled every cycle from tools/model.py (trace bench archived at legacy/v1/tools/tests/bench.py).</text>
<text x="24" y="116" font-size="10.5" text-anchor="start" class="m">UIO[0]</text>
<text x="24" y="132" font-size="10" text-anchor="start" class="m dim">TX</text>
<text x="24" y="148" font-size="9" text-anchor="start" class="dim">idle high</text>
<line x1="88" y1="123" x2="952" y2="123" class="grid" />
